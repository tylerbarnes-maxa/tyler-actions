<title>Tyler Actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFCD00;--y-dk:#C99F00;--y-lt:#FFF7D1;--ink:#131516;--ink2:#1E2224;
  --bg:#F3F3F1;--card:#FFFFFF;--line:#E5E5E1;--line2:#CFCFCA;
  --t1:#131516;--t2:#4A4E52;--t3:#8A8E92;
  --red:#D92D20;--red-lt:#FDECEA;--amber:#A86A00;--amber-lt:#FFF3D6;--green:#15803D;--green-lt:#E7F5EC;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.05);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
body.dark{
  --bg:#0E1012;--card:#191C20;--line:#272B30;--line2:#383D44;
  --t1:#F1F1EF;--t2:#B4B8BD;--t3:#717780;
  --y-lt:#2B2610;--red:#F0605A;--red-lt:#3A1A18;--amber:#E9A93A;--amber-lt:#33290F;--green:#4ADE80;--green-lt:#12291A;--sh:none;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--t1);font-size:14px;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--t1)}
svg{flex-shrink:0}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.sidebar{display:none}
.topbar{background:var(--ink);color:#fff;padding:calc(var(--safe-top) + 10px) 10px 10px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.tb-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--y);font-weight:700;font-size:16px;letter-spacing:-.01em}
.tb-brand img{width:26px;height:26px;border-radius:50%}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#666;display:inline-block;transition:background .3s}
.tb-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.search-bar{display:none;padding:10px 14px 0;gap:8px;align-items:center}
.search-bar.on{display:flex}
.search-bar input{flex:1;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);outline:none}
.search-bar input:focus{border-color:var(--y)}
.content{flex:1;overflow-y:auto;padding:14px 14px calc(var(--safe-bottom) + 100px);-webkit-overflow-scrolling:touch}
.wrapc{max-width:720px;margin:0 auto}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 4px calc(var(--safe-bottom) + 6px);z-index:30}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;font-size:10.5px;color:var(--t3);position:relative}
.bn svg{width:22px;height:22px}
.bn.on{color:var(--t1);font-weight:700}
.bn.on::before{content:'';position:absolute;top:-7px;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--y)}
.bn-badge{position:absolute;top:-1px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--y);color:var(--ink);font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid var(--card)}
.bn-badge.on{display:flex}
.bn-badge.muted{background:var(--line2);color:var(--t1)}
.bn-badge.red{background:var(--red);color:#fff}
.bn-add{flex:0 0 68px;display:flex;justify-content:center}
.bn-add button{width:54px;height:54px;border-radius:50%;background:var(--y);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;margin-top:-20px}
.bn-add button:active{transform:scale(.94)}

/* ── VIEW HEADERS ── */
.vh{margin:4px 2px 14px}
.vh h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.vh p{font-size:13px;color:var(--t3);margin-top:4px}
.th{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.btn-focus{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--y);font-weight:700;font-size:13px;padding:9px 14px 9px 12px;border-radius:20px;white-space:nowrap}
body.dark .btn-focus{background:var(--y);color:var(--ink)}
.pulse{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}
.pp{font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--t2)}
.pp b{color:var(--t1)}
.pp.red{background:var(--red-lt);border-color:transparent;color:var(--red)}.pp.red b{color:var(--red)}
.pp.ok{background:var(--green-lt);border-color:transparent;color:var(--green)}

/* ── SECTIONS ── */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sec h2{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:7px}
.sec h2 i{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:var(--t3)}
.sec.must h2{color:var(--t1)}
.sec.must h2::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--y)}
.sec-link{font-size:12px;font-weight:600;color:var(--t2)}
.hint{font-size:12px;color:var(--t3);margin:2px 4px 0}
.more-btn{width:100%;padding:9px;font-size:12.5px;font-weight:600;color:var(--t2);border-radius:10px;border:1px dashed var(--line2);margin-top:2px}

/* ── CARDS ── */
.card{position:relative;margin-bottom:6px;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.c-inner{position:relative;display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:var(--card);z-index:2;transition:transform .22s ease;touch-action:pan-y}
.card.dragging .c-inner{transition:none}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;color:transparent;margin-top:-1px;flex-shrink:0;transition:all .15s}
.tick:hover{border-color:var(--green);color:var(--green)}
.tick:active{background:var(--green);border-color:var(--green);color:#fff}
.card.waiting .tick,.p-row .tick{border-style:dashed}
.tick.sm{width:20px;height:20px}
.c-body{flex:1;min-width:0;cursor:pointer}
.c-title{font-size:14.5px;line-height:1.35;word-break:break-word}
.c-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:12px;color:var(--t3)}
.c-meta:empty{display:none}
.c-meta .late{color:var(--red);font-weight:700}
.c-meta .due{color:var(--amber);font-weight:700}
.c-meta .star{color:var(--y-dk);font-weight:700}
body.dark .c-meta .star{color:var(--y)}
.c-meta .who{color:var(--t2);font-weight:600}
.c-meta .zom{color:var(--amber)}
.card.big{border-left:3px solid var(--y)}
.card.big .c-inner{padding:13px 13px 13px 11px}
.card.big .c-title{font-size:16px;font-weight:600}
.card.sugg{border-left:3px dashed var(--y)}
.card.is-late{border-left:3px solid var(--red)}
.sugg-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.card.done-c .c-title{color:var(--t3);text-decoration:line-through}
.c-acts{display:none;flex-wrap:wrap;gap:6px;padding:0 12px 12px 45px;position:relative;z-index:2;background:var(--card)}
.card.open .c-acts,.c-acts.on{display:flex}
.c-notes{width:100%;font-size:12.5px;color:var(--t2);line-height:1.5;white-space:pre-wrap;padding:8px 10px;background:var(--bg);border-radius:8px;margin-bottom:2px}
.tri{display:flex;gap:5px;padding:0 12px 11px 45px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:2;background:var(--card)}
.tri::-webkit-scrollbar{display:none}

/* swipe */
.sw-done,.sw-tray{position:absolute;top:0;bottom:0;z-index:1;opacity:0}
.sw-done{left:0;right:0;background:var(--green);color:#fff;display:flex;align-items:center;padding-left:18px;font-weight:700;font-size:13px}
.sw-tray{right:0;display:flex}
.card.sw-r .sw-done,.card.sw-l .sw-tray,.card.tray-open .sw-tray{opacity:1}
.sw-tray button{width:66px;font-size:11.5px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sw-tray button:nth-child(1){background:#3A3D3F}
.sw-tray button:nth-child(2){background:#A86A00}
.sw-tray button:nth-child(3){background:#131516}

/* chips */
.chip{font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:16px;background:var(--bg);border:1px solid var(--line);color:var(--t1);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip:hover{border-color:var(--line2)}
.chip.s{font-size:12px;padding:5px 10px}
.chip.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.chip.g{background:var(--green-lt);border-color:transparent;color:var(--green)}
.chip.r{color:var(--red)}
.chip.ghost{background:none;border-color:transparent;color:var(--t3)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
body.dark .chip.sel{background:var(--y);border-color:var(--y);color:var(--ink)}

/* ── PEOPLE ── */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;overflow:hidden;box-shadow:var(--sh)}
.p-head{display:flex;align-items:center;gap:11px;padding:10px 10px 10px 12px;cursor:pointer}
.av{border-radius:50%;flex-shrink:0;object-fit:cover;object-position:center top;display:flex;align-items:center;justify-content:center;font-weight:700}
.p-mid{flex:1;min-width:0}
.p-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px}
.p-kind{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.p-sub{font-size:12px;color:var(--t3);margin-top:1px}
.p-sub .hot{color:var(--amber);font-weight:700}
.p-prev{font-size:12.5px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-body{border-top:1px solid var(--line);padding:4px 0 10px}
.p-lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:10px 12px 2px}
.p-row{display:flex;align-items:flex-start;gap:10px;padding:8px 12px}
.p-row-wrap .c-acts{padding:0 12px 8px 42px;background:none}
.p-empty{font-size:13px;color:var(--t3);padding:12px}
.p-foot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}

/* ── BRIEF / WRAP ── */
.brief{background:var(--ink);color:#fff;border-radius:16px;padding:16px 16px 14px;margin-bottom:6px;position:relative;overflow:hidden}
.brief::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--y)}
.b-day{font-size:11.5px;letter-spacing:.16em;font-weight:700;color:var(--y)}
.b-big{font-size:21px;font-weight:700;margin-top:8px;line-height:1.2;letter-spacing:-.01em}
.b-lines{font-size:13px;color:rgba(255,255,255,.62);margin-top:5px}
.b-lines b{color:#fff}.b-lines .r{color:#F87171}
.b-first{margin-top:14px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;gap:10px;align-items:center;width:100%;text-align:left;color:#fff}
.b-first small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:3px}
.b-first span.t{font-size:15px;font-weight:600;line-height:1.3}
.b-play{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--y);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b-start{margin-top:10px;width:100%;padding:12px;border-radius:12px;background:var(--y);color:var(--ink);font-weight:800;font-size:13.5px;letter-spacing:.08em}
.wrapb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--y-lt);border:1px solid var(--y);margin-bottom:6px}
.wrapb b{display:block;font-size:14px}
.wrapb span{font-size:12.5px;color:var(--t2)}
.wrapb svg{margin-left:auto}
.banner{padding:12px 14px;border-radius:12px;background:var(--y-lt);border:1px solid var(--y);font-size:13px;line-height:1.45;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner button{margin-left:auto;font-weight:700;font-size:12px;color:var(--t2)}

/* footer links */
.foot{margin-top:22px;display:flex;flex-direction:column;gap:6px}
.fl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--t2)}
.fl b{color:var(--t1)}
.fl svg{margin-left:auto;color:var(--t3)}
.calm{text-align:center;padding:42px 20px 26px;color:var(--t3);font-size:13px}
.calm b{display:block;font-size:18px;color:var(--t1);margin-bottom:6px;letter-spacing:-.01em}
.calm .ic{width:48px;height:48px;border-radius:50%;background:var(--green-lt);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}

/* ── REVIEW ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.tile b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:12px;color:var(--t3)}
.tile.red b{color:var(--red)}.tile.ok b{color:var(--green)}
.bars{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.bar-row{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.bar-row+.bar-row{border-top:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);border-radius:4px}
.bar-n{text-align:right;color:var(--t3);font-size:12px}
.bar-n b{color:var(--t1)}
.list-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px}
.lb-row+.lb-row{border-top:1px solid var(--line)}
.lb-row .grow{flex:1;min-width:0}
.lb-row small{color:var(--t3);font-size:12px}
.setting{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px}
.setting h3{font-size:14px;margin-bottom:4px}
.setting p{font-size:12.5px;color:var(--t3);margin-bottom:10px;line-height:1.45}

/* ── SHEETS ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:20px 20px 0 0;padding:8px 16px calc(var(--safe-bottom) + 18px);max-height:92dvh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 12px}
.sh-title{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.sh-sub{font-size:13px;color:var(--t2);margin-bottom:12px;line-height:1.45}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin:16px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.btn.pri{background:var(--y);border-color:var(--y);color:var(--ink)}
.btn.dng{color:var(--red)}
.btn.grow{flex:1}
.field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.field:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,205,0,.2)}
textarea.field{resize:vertical;min-height:70px;line-height:1.45}
select.field{padding:9px 10px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px;text-align:left}
.menu-item:last-child{border-bottom:none}
.menu-item small{margin-left:auto;color:var(--t3);font-size:12.5px;white-space:nowrap}
.menu-item.r{color:var(--red)}
.wr{padding:12px 0;border-bottom:1px solid var(--line)}
.wr:last-of-type{border-bottom:none}
.wr-t{font-size:14.5px;line-height:1.35}
.wr-q{font-size:12px;color:var(--amber);font-weight:700;margin-top:3px}
.wr .row{margin-top:8px}
.wr-res{font-size:13px;color:var(--t3)}
.wr-res b{color:var(--t1)}

/* capture */
.cap-input{width:100%;border:none;outline:none;background:none;font-size:19px;font-weight:500;line-height:1.35;resize:none;padding:4px 2px;min-height:32px;max-height:200px;display:block}
.cap-input::placeholder{color:var(--t3)}
.cap-parse{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.cap-parse:empty{display:none}
.pchip{font-size:12px;font-weight:600;padding:4px 4px 4px 10px;border-radius:14px;background:var(--y-lt);border:1px solid var(--y);display:inline-flex;align-items:center;gap:2px}
.pchip button{width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;color:var(--t3);display:flex;align-items:center;justify-content:center}
.cap-dates{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.cap-dates::-webkit-scrollbar{display:none}
.cap-bar{display:flex;align-items:center;gap:8px;margin-top:14px}
.more-tg{font-size:13px;font-weight:600;color:var(--t2);padding:10px 4px;display:flex;align-items:center;gap:4px}
.cap-hint{font-size:11.5px;color:var(--t3);margin-top:10px;line-height:1.5}
.cap-hint code{font-family:inherit;background:var(--bg);border-radius:4px;padding:0 4px;color:var(--t2)}
.cm-grid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── FOCUS ── */
#focus-ov{position:fixed;inset:0;z-index:150;background:#0B0C0D;color:#fff;display:none;flex-direction:column}
#focus-ov.on{display:flex}
.fo-prog{position:absolute;top:0;left:0;height:3px;background:var(--y);width:0;transition:width .5s linear}
.fo-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 14px) 14px 0 20px;max-width:640px;width:100%;margin:0 auto}
.fo-count{font-size:11.5px;letter-spacing:.16em;font-weight:700;color:rgba(255,205,0,.75)}
.fo-x{width:40px;height:40px;border-radius:50%;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center}
.fo-x:hover{background:rgba(255,255,255,.08)}
.fo-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 24px;text-align:center;max-width:640px;width:100%;margin:0 auto}
.fo-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:14px}
.fo-meta .late{color:#F87171;font-weight:700}.fo-meta .due{color:#FBBF24;font-weight:700}.fo-meta .star{color:var(--y)}
.fo-title{font-size:clamp(24px,6.4vw,36px);font-weight:700;line-height:1.22;letter-spacing:-.015em}
.fo-note{font-size:14px;color:rgba(255,255,255,.5);margin-top:12px;line-height:1.5;white-space:pre-wrap;max-width:440px}
.fo-timer{margin-top:38px;font-size:58px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--y);letter-spacing:-.03em;cursor:pointer;line-height:1;user-select:none}
.fo-timer.idle{color:rgba(255,255,255,.3)}
.fo-tlabel{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px}
.fo-len{display:flex;gap:6px;margin-top:12px}
.fo-len button{font-size:12px;font-weight:600;padding:5px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.55)}
.fo-len button.sel{border-color:var(--y);color:var(--y)}
.fo-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 18px 8px;max-width:640px;margin:0 auto;width:100%}
.fo-acts button{padding:17px 6px;border-radius:14px;font-weight:700;font-size:14.5px;background:rgba(255,255,255,.09);color:#fff}
.fo-acts button:hover{background:rgba(255,255,255,.14)}
.fo-acts .fo-done{background:var(--y);color:var(--ink)}
.fo-acts .fo-done:hover{background:#FFD83A}
.fo-sub{display:flex;justify-content:center;gap:22px;padding:6px 0 calc(var(--safe-bottom) + 20px)}
.fo-sub button{font-size:13px;color:rgba(255,255,255,.45);padding:6px}
.fo-sub button:hover{color:#fff}

/* ── TOAST ── */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 86px);transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 8px 10px 16px;border-radius:24px;font-size:13px;font-weight:600;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px);box-shadow:0 6px 22px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{padding-right:8px}
.toast button{color:var(--y);font-weight:700;padding:4px 10px;border-left:1px solid rgba(255,255,255,.15)}
body.dark .toast{background:#2A2E33}
body.focus-on .toast{bottom:calc(var(--safe-bottom) + 150px);background:#2A2E33}

/* ── DESKTOP ── */
@media(min-width:900px){
  .app{max-width:none;flex-direction:row}
  .sidebar{display:flex;flex-direction:column;width:236px;flex-shrink:0;background:var(--ink);padding:22px 12px 18px;gap:2px;height:100dvh;overflow-y:auto}
  .sb-brand{display:flex;align-items:center;gap:10px;color:var(--y);font-weight:700;font-size:16px;padding:0 8px 18px}
  .sb-brand img{width:28px;height:28px;border-radius:50%}
  .sb-cap{margin:0 0 14px;display:flex;align-items:center;gap:8px;justify-content:center;background:var(--y);color:var(--ink);font-weight:700;padding:11px;border-radius:12px;font-size:14px}
  .sb-cap kbd{font-family:inherit;font-size:11px;opacity:.55;margin-left:4px}
  .sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:rgba(255,255,255,.66);font-size:14px;text-align:left;width:100%}
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function $(id){ return document.getElementById(id); }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function first(n){ return (n||'').trim().split(/\s+/)[0]; }
function initials(n){ var p=(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }

/* ── DATES (local time — old app used UTC and flipped days at 00:00–01:00 BST) ── */
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function pad(n){ return (n<10?'0':'')+n; }
function dstr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function pd(s){ return new Date(s+'T12:00:00'); }
function addDays(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return dstr(d); }
function isWknd(d){ var g=d.getDay(); return g===0||g===6; }
function addWorkingDays(s,n){ var d=pd(s),a=0; while(a<n){ d.setDate(d.getDate()+1); if(!isWknd(d)) a++; } return dstr(d); }
function nextWD(){ return addWorkingDays(today(),1); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/864e5); }
function endOfWeek(){ var d=new Date(),g=d.getDay(); d.setDate(d.getDate()+(g===6?6:g===0?5:5-g)); return dstr(d); }
function nextMonday(){ var d=new Date(),g=d.getDay(); d.setDate(d.getDate()+(g===0?1:8-g)); return dstr(d); }
function firstWDNextMonth(){ var d=new Date(); var f=new Date(d.getFullYear(),d.getMonth()+1,1,12); while(isWknd(f)) f.setDate(f.getDate()+1); return dstr(f); }
function endOfMonth(){ var d=new Date(); var e=new Date(d.getFullYear(),d.getMonth()+1,0,12); while(isWknd(e)) e.setDate(e.getDate()-1); if(dstr(e)<today()){ e=new Date(d.getFullYear(),d.getMonth()+2,0,12); while(isWknd(e)) e.setDate(e.getDate()-1); } return dstr(e); }
function nextDow(dow,nextWeek){ var d=new Date(),g=d.getDay(),add; if(nextWeek){ add=(g===0?1:8-g)+((dow+6)%7); } else { add=(dow-g+7)%7; if(add===0) add=7; } d.setDate(d.getDate()+add); return dstr(d); }
function fmt(s){ if(!s) return ''; return pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function rel(s){ if(!s) return ''; var n=diffDays(today(),s); if(n===0) return 'today'; if(n===1) return 'tomorrow'; if(n===-1) return 'yesterday'; if(n>1&&n<7) return WD[pd(s).getDay()]; if(n<-1&&n>-7) return WD[pd(s).getDay()]; return fmt(s); }
function Rel(s){ var r=rel(s); return r.charAt(0).toUpperCase()+r.slice(1); }
function relLong(s){ if(!s) return ''; var n=diffDays(today(),s); if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; return WD[pd(s).getDay()]+' '+fmt(s); }
function ago(ts){ var m=(Date.now()-ts)/6e4; if(m<60) return Math.max(1,Math.round(m))+'m'; var h=m/60; if(h<24) return Math.round(h)+'h'; return Math.round(h/24)+'d'; }
function dayOf(ts){ return dstr(new Date(ts)); }

  if(weekday===-1){ while(d.getMonth()===month){ if(!isWknd(d)) count++; if(count===nth) return d; d.setDate(d.getDate()+1); } return null; }
  while(d.getMonth()===month){ if(d.getDay()===weekday){ count++; if(count===nth) return d; } d.setDate(d.getDate()+1); }
  return null;
}
function nextMonthlyOccurrence(nth,weekday){

}

  if(t.recurDays) return 'Every '+t.recurDays+' working day'+(t.recurDays===1?'':'s');

/* ── TASK MODEL ── */
function st(t){ return t.state||(t.done?'done':'mine'); }
function isOpen(t){ var s=st(t); return s==='mine'||s==='waiting'||s==='parked'; }
function isMine(t){ return st(t)==='mine'; }
function hasP(t){ return !!(t.assign&&t.assign!=='Me'); }
function active(t){ return isMine(t)&&!!t.due&&t.due<=today(); }
function lateHard(t){ return isMine(t)&&!!t.hard&&!!t.due&&t.due<today(); }

function future(t){ return isMine(t)&&!!t.due&&t.due>today()&&!t.focus; }
function needsChase(t){
  if(st(t)!=='waiting') return false;
  if(t.due) return t.due<=today();
  return (Date.now()-(t.waitingSince||t.created||0))>3*864e5;
}
function find(id){ for(var i=0;i<tasks.length;i++) if(tasks[i].id===id) return tasks[i]; return null; }
function focusCount(){ return tasks.filter(function(t){ return isMine(t)&&t.focus; }).length; }
function ageDays(t){ return Math.floor((Date.now()-(t.created||Date.now()))/864e5); }
function isZombie(t){ return (t.rolls||0)>=3 || (isOpen(t)&&!t.isRecurring&&!t.recurDays&&!t.recurMonthly&&ageDays(t)>=21); }
function score(t){ var s=0; if(t.hard) s+=20; if(t.prio==='High') s+=8; if(t.due) s+=Math.min(Math.max(diffDays(t.due,today()),0),10); s+=Math.min(t.rolls||0,3); return s; }

/* MUST MOVE: pinned Focus items + hard deadlines due today/late.
   If nothing is pinned, the app suggests up to 2 so Today is never a flat list. */
function mustMove(){
  var T=today();
  var list=tasks.filter(function(t){ return isMine(t)&&((t.focus&&(!t.due||t.due<=T||t.hard))||(t.hard&&t.due&&t.due<=T)); });
  list.sort(function(a,b){ return (lateHard(b)-lateHard(a))||((b.focus?1:0)-(a.focus?1:0))||(score(b)-score(a)); });
  if(list.length) return {items:list,sugg:false};
  var cand=tasks.filter(active).sort(function(a,b){ return score(b)-score(a)||((a.created||0)-(b.created||0)); });
  if(cand.length<=2) return {items:[],sugg:false};   // short day: no need to suggest, just show the list
  return {items:cand.slice(0,2),sugg:true};
}
function alsoToday(skip){
  skip=skip||{};
  return tasks.filter(function(t){ return active(t)&&!skip[t.id]; })
    .sort(function(a,b){ return a.due<b.due?1:a.due>b.due?-1:((a.created||0)-(b.created||0)); });
}
function todaySet(){ var m=mustMove(),ids={}; m.items.forEach(function(t){ ids[t.id]=1; }); return {must:m,also:alsoToday(ids)}; }

/* ── PEOPLE ── */

}

  if(m&&m.photo) return '<img class="av" src="'+m.photo+'" style="width:'+size+'px;height:'+size+'px" alt="">';
  var i=0; for(var k=0;k<name.length;k++) i+=name.charCodeAt(k); var p=AV[i%AV.length];
  return '<div class="av" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.36)+'px;background:'+p.bg+';color:'+p.tc+'">'+esc(initials(name))+'</div>';

    var p=get(t.assign), lc=t.lastChased||t.lastEmailSent||0; if(lc>p.last) p.last=lc;

}

  var team=members.filter(function(m){ return kindOf(m)==='Team'; }).map(function(m){ return m.name; });

/* ── MIGRATION v4 → v5 (additive: old fields kept, new fields added) ── */
function migrateTask(t,now){
  if(t.v>=MODEL_V) return false;
  var fresh=false;
  if(!t.state){
    if(t.done) t.state='done';
    else if(hasP(t)){ t.state='waiting'; t.waitingSince=t.waitingSince||t.created||now; }
    else t.state='mine';
  }
  if(t.ctx&&CTX_MAP[t.ctx]) t.ctx=CTX_MAP[t.ctx];
  if(t.hard===undefined) t.hard=false;
  if(t.state==='mine'&&t.due&&diffDays(t.due,today())>7){ t.oldDue=t.due; t.due=''; t.freshStart=true; fresh=true; }
  if(t.done&&!t.doneAt) t.doneAt=t.modified||t.created||now;
  t.v=MODEL_V; t.modified=now; _dirty[t.id]=1;
  return fresh?'fresh':true;
}

  if(fresh){ lsSet('maxa_fresh_n',String((+lsGet('maxa_fresh_n')||0)+fresh)); lsRemove('maxa_fresh_dismissed'); }
  if(ch) saveTasks();

}

  var changed=false;
  lsJSON(CONTACTS_KEY,[]).forEach(function(c){ if(c&&c.name&&!memberByName(c.name)){ members.push({id:uid(),name:c.name,email:c.email||'',kind:'Other'}); changed=true; } });
  lsSet('maxa_contacts_merged_v5','1');

}
function load(){

  tasks=tasks.filter(function(t){ return t&&t.id; });
  members=lsJSON(STORE_MEMBERS,[]);
  if(!Array.isArray(members)||!members.length){ members=DEFAULT_MEMBERS.map(function(m){ return Object.assign({},m); }); saveMembers(true); }
  members.forEach(function(m){ if(!m.photo){ var d=DEFAULT_MEMBERS.find(function(x){ return x.id===m.id||x.name===m.name; }); if(d&&d.photo) m.photo=d.photo; } });

var NAME_STOP={will:1,may:1,mark:1,bill:1,frank:1,grace:1,rich:1,joy:1,sue:1,pat:1,don:1,rob:1,art:1,ray:1,max:1,jack:1,amber:1,hope:1,dawn:1,eve:1,lee:1,guy:1,chase:1,rose:1,penny:1,drew:1,dean:1,jay:1,sky:1,april:1,june:1,august:1,summer:1,victor:0};

var AREA_KW=[
  ['Shareholder',/\b(board|shareholders?|dividends?|investors?|valuation|agm|share ?price|accounts sign.?off)\b/i],

function inferArea(raw,person){

══════════════════════════════════════════ */
function snap(t){ return JSON.parse(JSON.stringify(t)); }

    commit(); if(typeof renderFocus==='function'&&$('focus-ov').classList.contains('on')) renderFocus(); toast('Undone');
  };
}
function spawnRecur(t){
  var nd=t.recurMonthly?nextMonthlyOccurrence(t.recurMonthly.nth,t.recurMonthly.weekday):addWorkingDays(today(),t.recurDays||1);
  var n={id:uid(),text:t.text,ctx:t.ctx||'',prio:t.prio||'Normal',assign:t.assign||'Me',notes:t.notes||'',state:'mine',due:nd,hard:!!t.hard,created:Date.now(),isRecurring:true,v:MODEL_V};
  if(t.assignEmail) n.assignEmail=t.assignEmail;
  if(t.recurDays) n.recurDays=t.recurDays; if(t.recurMonthly) n.recurMonthly=t.recurMonthly;

}

  if(t.recurDays||t.recurMonthly) spawned=spawnRecur(t);
  if(navigator.vibrate) navigator.vibrate(12);

}

  mut(t,{state:'dropped',doneAt:Date.now(),focus:false}); if(expandedId===id) expandedId=null;

   Same tables/rows as v4 (tasks: {id,data,updated_at}; members; '__deleted__' tombstone row).
   Fixed: v4 deleted every remote row missing locally, so a fresh/cleared
   device could wipe the cloud. Remote deletes now only follow tombstones.
   Only changed rows are pushed (debounced).
══════════════════════════════════════════ */
var SUPA_URL='https://hfciytpbjtijlzgtznqv.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmY2l5dHBianRpamx6Z3R6bnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMjIxMzUsImV4cCI6MjA5Nzc5ODEzNX0.WWmwBKe2yGaLUwsPMK8KRZ7nJBjT_Q74PRuHL7rORH0';

function getDeletedIds(){ return lsJSON(DELETED_KEY,{}); }
function recordDeleted(id){

async function supaFetch(method,table,body,deleteId){
  var url=SUPA_URL+'/rest/v1/'+table;
  if(method==='GET') url+='?select=*&limit=10000';

  var opts={method:method,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'resolution=merge-duplicates,return=minimal':''}};
  if(body) opts.body=JSON.stringify(body);
  var res=await fetch(url,opts);
  if(!res.ok){ var tx=await res.text(); throw new Error('Supabase '+method+' '+table+': '+res.status+' '+tx.substring(0,100)); }
  if(method==='GET') return await res.json();

function schedulePush(){ clearTimeout(_pushTimer); _pushTimer=setTimeout(function(){ syncPush(false); },900); }
async function syncPush(showToast,full){
  if(_syncing){ schedulePush(); return; }
  _syncing=true; if(showToast) setSyncDot('syncing');
  var sending={}; (full?tasks.map(function(t){ return t.id; }):Object.keys(_dirty)).forEach(function(id){ sending[id]=1; });
  var dels=Object.keys(_pendingDel), memDirty=_membersDirty, tomb=_tombDirty;
  _dirty={}; _pendingDel={}; _membersDirty=false; _tombDirty=false;
  try{
    var iso=new Date().toISOString();
    var rows=tasks.filter(function(t){ return sending[t.id]; }).map(function(t){ return {id:t.id,data:t,updated_at:iso}; });
    for(var i=0;i<rows.length;i+=50) await supaFetch('POST','tasks',rows.slice(i,i+50));
    if(dels.length||tomb){
      await supaFetch('POST','tasks',[{id:'__deleted__',data:{ids:getDeletedIds()},updated_at:iso}]);
      for(var j=0;j<dels.length;j++) await supaFetch('DELETE','tasks',null,dels[j]);
    }
    if(memDirty&&members.length){
      await supaFetch('POST','members',members.map(function(m){ var c={}; for(var k in m) if(k!=='photo') c[k]=m[k]; return {id:m.id,data:c,updated_at:iso}; }));
    }
    lsSet(SYNC_LAST_KEY,Date.now().toString()); setSyncDot('ok');
    if(showToast) toast('Synced ✓');
  }catch(e){
    Object.keys(sending).forEach(function(id){ _dirty[id]=1; }); dels.forEach(function(id){ _pendingDel[id]=1; }); if(memDirty) _membersDirty=true; if(tomb) _tombDirty=true;
    setSyncDot('error'); if(showToast) toast('Sync failed — will retry');
    console.error('syncPush',e);
  }
  lsSet('maxa_dirty_v5',JSON.stringify(_dirty)); lsSet('maxa_pdel_v5',JSON.stringify(_pendingDel));
  _syncing=false;
}
function parseRow(r){ if(!r||!r.data) return null; if(typeof r.data==='string'){ try{ return JSON.parse(r.data); }catch(e){ return null; } } return r.data; }
async function syncPull(showToast){
  if(_syncing) return; _syncing=true; if(showToast) setSyncDot('syncing');
  try{
    var taskRows=await supaFetch('GET','tasks'), memberRows=await supaFetch('GET','members');
    var changed=false;
    if(Array.isArray(taskRows)&&taskRows.length){
      var tomb=taskRows.find(function(r){ return r.id==='__deleted__'; });
      if(tomb&&tomb.data&&tomb.data.ids){
        var remoteDel=tomb.data.ids; lsSet(DELETED_KEY,JSON.stringify(Object.assign({},getDeletedIds(),remoteDel)));
        var before=tasks.length; tasks=tasks.filter(function(t){ return !remoteDel[t.id]; }); if(tasks.length<before) changed=true;
      }
      var remote=taskRows.filter(function(r){ return r.id!=='__deleted__'&&r.id!=='__ledger__'; }).map(parseRow).filter(function(t){ return t&&t.id; });
      var deleted=getDeletedIds(), local={}, rem={}, all={};
      tasks.forEach(function(t){ local[t.id]=t; all[t.id]=1; });
      remote.forEach(function(t){ rem[t.id]=t; if(!deleted[t.id]) all[t.id]=1; });
      var merged=Object.keys(all).map(function(id){
        var l=local[id],r=rem[id]; if(!l) return r; if(!r) return l;
        if(_dirty[id]) return l;
        return (r.modified||r.created||0)>=(l.modified||l.created||0)?r:l;
      });
      var sig=function(arr){ return arr.map(function(t){ return t.id+':'+(t.modified||t.created||0); }).sort().join('|'); };
      if(sig(merged)!==sig(tasks)){ tasks=merged; changed=true; }
      if(tasks.some(function(t){ return !(t.v>=MODEL_V); })) migrateAll();
      if(changed) saveTasksLocal();
    }
    if(Array.isArray(memberRows)&&memberRows.length&&!_membersDirty){
      var rm=memberRows.map(parseRow).filter(function(m){ return m&&m.id; });
      rm.forEach(function(m){ var loc=members.find(function(x){ return x.id===m.id; }); var d=DEFAULT_MEMBERS.find(function(x){ return x.id===m.id||x.name===m.name; }); m.photo=(loc&&loc.photo)||(d&&d.photo)||undefined; if(!m.photo) delete m.photo; });
      var strip=function(a){ return JSON.stringify(a.map(function(m){ var c={}; for(var k in m) if(k!=='photo') c[k]=m[k]; return c; })); };
      if(rm.length&&strip(rm)!==strip(members)){ members=rm; saveMembers(true); changed=true; }
    }
    lsSet(SYNC_LAST_KEY,Date.now().toString()); setSyncDot('ok');
    if(changed) render(true);
    if(showToast) toast(changed?'Synced ✓':'Already up to date');
  }catch(e){
    setSyncDot('error'); if(showToast) toast('Sync failed — offline?'); console.error('syncPull',e);
  }
  _syncing=false;
}
function bgPull(){ _bgSync=true; syncPull(false).finally(function(){ _bgSync=false; if(Object.keys(_dirty).length||Object.keys(_pendingDel).length) schedulePush(); }); }
async function syncNow(){ await syncPull(false); await syncPush(true,true); }

    b.unshift(nb); if(b.length>MAX_BACKUPS) b=b.slice(0,MAX_BACKUPS);

var cap=null;
function openCapture(o){
  o=o||{};
  cap={id:o.id||null,manual:{},ignore:{},date:'',hard:false,person:'',state:'mine',area:'',focus:false,recur:null,more:!!o.id,noParse:false};
  if(o.person){ cap.person=o.person; cap.manual.person=true; }
  if(o.state){ cap.state=o.state; cap.manual.state=true; }
  var text='';
  if(cap.id){
    var t=find(cap.id); if(!t) return; text=t.text;
    Object.assign(cap,{date:t.due||'',hard:!!t.hard,person:hasP(t)?t.assign:'',state:isOpen(t)?st(t):'mine',area:t.ctx||'',focus:!!t.focus,noParse:true,
      recur:t.recurMonthly?{type:'monthly',nth:t.recurMonthly.nth||1,weekday:t.recurMonthly.weekday||'Mon'}:t.recurDays?{type:'days',n:t.recurDays}:null});
    cap.manual={date:1,person:1,state:1,area:1,focus:1,hard:1};
  }
  var ta=$('cap-text'); ta.value=text;
  $('cap-save').textContent=cap.id?'Save':'Save';
  $('cap-hint').style.display=cap.id?'none':'';
  renderCapMore(); capInput();
  $('cap-ov').classList.add('open');
  setTimeout(function(){ ta.focus(); var l=ta.value.length; try{ ta.setSelectionRange(l,l); }catch(e){} },60);
}
function closeCap(){ $('cap-ov').classList.remove('open'); cap=null; }
function capEff(text){
  var ign={date:cap.ignore.date||cap.manual.date,person:cap.ignore.person||cap.manual.person,area:cap.ignore.area||cap.manual.area,focus:cap.ignore.focus||cap.manual.focus};
  var p=cap.noParse?{}:parseCapture(text,ign), e={};
  ['date','hard','person','state','area','focus'].forEach(function(f){ e[f]=cap.manual[f]?cap[f]:(p[f]!==undefined?p[f]:cap[f]); });
  if(cap.manual.date&&!cap.manual.hard) e.hard=cap.hard;
  if(cap.manual.state) e.state=cap.state;
  e.title=cap.noParse?text.trim():p.title; e.p=p;
  return e;
}
function capInput(){
  if(!cap) return; var ta=$('cap-text');
  ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,200)+'px';
  var lines=ta.value.split('\n').filter(function(l){ return l.trim(); });
  var e=capEff(lines[0]||''), p=e.p, chips=[];
  if(lines.length>1) chips.push('<span class="pchip" style="padding-right:10px">'+lines.length+' actions — one per line</span>');
  if(!cap.noParse&&lines.length<=1){
    if(p.person&&!cap.manual.person) chips.push('<span class="pchip">'+(p.state==='waiting'&&!cap.manual.state?'⏳ Waiting on ':'→ ')+esc(p.person)+'<button data-a="capIgn" data-v="person">×</button></span>');
    if(p.date&&!cap.manual.date) chips.push('<span class="pchip">'+esc(relLong(p.date))+(p.hard?' · deadline':'')+'<button data-a="capIgn" data-v="date">×</button></span>');
    if(p.area&&!cap.manual.area) chips.push('<span class="pchip"># '+esc(p.area)+'<button data-a="capIgn" data-v="area">×</button></span>');
    if(p.focus&&!cap.manual.focus) chips.push('<span class="pchip">★ Focus<button data-a="capIgn" data-v="focus">×</button></span>');

    var t={id:uid(),text:e.title||line,state:e.state==='waiting'?'waiting':'mine',assign:e.person||'Me',due:e.date||'',hard:false,ctx:e.area||'',focus:false,notes:lines.length===1?notes:'',prio:'Normal',created:Date.now(),v:MODEL_V};
    if(t.state==='waiting'){ t.waitingSince=Date.now(); if(!t.due) t.due=addWorkingDays(T,2); }

function wrapAct(id,v){

  openSheet('<button class="menu-item" data-a="go" data-v="review">Review<small>am I in control?</small></button>'
    +'<button class="menu-item" data-a="go" data-v="done">Done<small>finished & dropped</small></button>'
    +'<button class="menu-item" data-a="focus">Focus<small>one thing at a time</small></button>'
    +'<button class="menu-item" data-a="wrap">Wrap up today</button>'
    +'<button class="menu-item" data-a="theme" data-v="'+(dark?'light':'dark')+'">'+(dark?'Light mode':'Dark mode')+'</button>'
    +'<button class="menu-item" data-a="go" data-v="settings">Settings<small>sync · backups</small></button>');
}
function applyTheme(){
  var m=lsGet('maxa_theme_v1')||'system';
  var dark=m==='dark'||(m==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('dark',dark);
  document.documentElement.style.background=dark?'#0E1012':'#F3F3F1';
}

var _suppressClick=false;
var A={
  go:function(id,v){ closeSheet(); go(v); },
  goPerson:function(id,v,p){ openP={}; openP[p]=1; go('people'); },
  capture:function(){ openCapture(); },
  expand:function(id){ expandedId=expandedId===id?null:id; render(); },

  tomorrow:function(id){ doDefer(id,nextWD()); },
  defer:function(id,v){ closeSheet(); doDefer(id,v||''); },
  deferPick:function(id){ var v=$('pick-date').value; if(!v) return; closeSheet(); doDefer(id,v); },
  later:function(id){ openLater(id); },
  park:function(id){ closeSheet(); doPark(id); },
  wait:function(id){ openWait(id); },

  wpChase:function(id,v){ var i=$('wp-new'); wp.typed=i?i.value.trim():''; if(wp.typed) wp.person=wp.typed; wp.chase=v; renderWait(); },
  wpSave:function(){ var i=$('wp-new'); if(i&&i.value.trim()) wp.person=i.value.trim(); if(!wp.person){ toast('Who are you waiting on?'); return; } var after=wp.after; closeSheet(); doWaiting(wp.id,wp.person,wp.chase); if(after) after(); },
  chased:function(id){ doChased([id]); },
  snooze:function(id){ openSnooze(id); },
  snoozeTo:function(id,v){ var t=find(id); if(!t) return; var s=snap(t); mut(t,{due:v}); closeSheet(); expandedId=null; commit(); toast('Chase '+rel(v),undoable([s])); },
  backToMe:function(id){ doBackToMe(id); },
  focusTg:function(id){ toggleFocus(id); },
  swapFocus:function(oldId,newId){ var o=find(oldId),n=find(newId); if(!o||!n) return; var s=[snap(o),snap(n)]; mut(o,{focus:false}); var c={focus:true,state:'mine'}; if(!n.due||(n.due>today()&&!n.hard)) c.due=today(); mut(n,c); closeSheet(); commit(); toast('Swapped',undoable(s)); },
  edit:function(id){ openCapture({id:id}); },
  reopen:function(id){ doReopen(id); },
  delete:function(id){ var t=find(id); if(!t) return; confirmDialog('Delete for good?','“'+t.text+'” will be removed everywhere. Drop keeps a record; delete doesn’t.','Delete',function(){ if(cap) closeCap(); removeTask(id); }); },
  confirmOk:function(){ var cb=_confirmCb; _confirmCb=null; closeSheet(); if(cb) cb(); },
  closeSheet:function(){ closeSheet(); },
  undo:function(){ var f=_undoFn; _undoFn=null; $('toast').classList.remove('show'); if(f) f(); },
  ptoggle:function(id,v,p){ openP[p]=!openP[p]; expandedId=null; render(); },
  chaseAll:function(id,v,p){ openChase(p); },
  chaseSend:function(id,v){ chaseSend(v); },
  addFor:function(id,v,p){ openCapture({person:p,state:v}); },
  editP:function(id,v,p){ openPersonEdit(p); },
  peKind:function(id,v){ pe.kind=v; document.querySelectorAll('#pe-kinds .chip').forEach(function(b){ b.classList.toggle('sel',b.dataset.v===v); }); },
  peSave:function(){ savePerson(); },
  peDelete:function(){ var m=members.find(function(x){ return x.id===pe.id; }); if(!m) return; confirmDialog('Remove '+m.name+'?','Their open actions stay; they just won’t be a saved contact.','Remove',function(){ members=members.filter(function(x){ return x.id!==m.id; }); saveMembers(); deleteMemberRemote(m.id); render(); toast(m.name+' removed'); }); },
  showAlso:function(){ showAllAlso=true; render(); },
  showParked:function(){ showParked=!showParked; render(); },
  showQuiet:function(){ showQuiet=!showQuiet; render(); },
  startDay:function(){ lsSet('maxa_brief_v5',today()); render(); },
  focus:function(){ closeSheet(); startFocus(); },
  focusOn:function(id){ lsSet('maxa_brief_v5',today()); startFocus(id); },
  focusExit:function(){ exitFocus(); },
  fTimer:function(){ if(F.run) fPause(); else fStart(); renderFocus(); },
  fLen:function(id,v){ F.len=+v; F.rem=F.len*60; renderFocus(); },
  fDone:function(){ var t=fCur(); if(!t) return; doDone(t.id); fAdvance(); },
  fWait:function(){ var t=fCur(); if(!t) return; openWait(t.id,fAdvance); },
  fNext:function(){ fAdvance(); },
  fTom:function(){ var t=fCur(); if(!t) return; doDefer(t.id,nextWD()); fAdvance(); },
  fDrop:function(){ var t=fCur(); if(!t) return; doDrop(t.id); fAdvance(); },
  wrap:function(){ openWrap(); },
  wrapAct:function(id,v){ wrapAct(id,v); },
  wrapDone:function(){ lsSet('maxa_wrap_v5',today()); closeSheet(); render(); toast('Day wrapped.'); },
  freshOk:function(){ lsSet('maxa_fresh_dismissed','1'); render(); },
  search:function(){ if($('search-bar').classList.contains('on')) closeSearch(); else openSearch(); },
  searchClose:function(){ closeSearch(); },
  more:function(){ openMore(); },
  theme:function(id,v){ lsSet('maxa_theme_v1',v); applyTheme(); closeSheet(); render(); },
  syncNow:function(){ syncNow().then(function(){ render(); }); },
  pull:function(){ syncPull(true).then(function(){ render(); }); },
  backup:function(){ var b=createBackup('Manual'); toast(b?'Backed up '+b.count+' actions':'Nothing to back up'); render(); },
  restoreList:function(){ var list=allBackups(); var h='<div class="sh-title">Restore a backup</div><div class="sh-sub">Your current list is backed up before restoring.</div>'; if(!list.length) h+='<div class="calm">No backups yet.</div>'; list.forEach(function(x){ var d=new Date(x.b.ts); h+='<button class="menu-item" data-a="restore" data-id="'+x.src+'" data-v="'+x.i+'">'+esc(x.b.label||'Auto')+'<small>'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+x.b.count+'</small></button>'; }); openSheet(h); },
  restore:function(src,i){ closeSheet(); restoreBackup(src,+i); },
  reload:function(){ window.location.reload(); },
  capMore:function(){ cap.more=!cap.more; renderCapMore(); capInput(); },
  capClose:function(){ closeCap(); },
  capSave:function(){ saveCapture(); },
  capIgn:function(id,v){ cap.ignore[v]=true; capInput(); $('cap-text').focus(); },
  capDate:function(id,v){ cap.date=v; cap.manual.date=true; if(!v){ cap.hard=false; } capInput(); },
  capState:function(id,v){ cap.state=v; cap.manual.state=true; if(v!=='waiting'&&!cap.manual.person){ var e=capEff($('cap-text').value.split('\n')[0]||''); cap.person=e.person||''; cap.manual.person=true; } capInput(); },
  capPerson:function(id,v){ cap.person=v; cap.manual.person=true; var n=$('cm-newp'); if(n) n.value=''; capInput(); },
  capArea:function(id,v){ cap.area=v; cap.manual.area=true; capInput(); },
  capHard:function(){ var e=capEff($('cap-text').value.split('\n')[0]||''); cap.hard=!e.hard; cap.manual.hard=true; if(!cap.manual.date){ cap.date=e.date||today(); cap.manual.date=true; } capInput(); },
  capFocus:function(){ var e=capEff($('cap-text').value.split('\n')[0]||''); cap.focus=!e.focus; cap.manual.focus=true; capInput(); },
  capRecur:function(id,v){ cap.recur=v==='off'?null:v==='days'?{type:'days',n:5}:{type:'monthly',nth:1,weekday:'Mon'}; renderRecur(); }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return;
  if(_suppressClick){ _suppressClick=false; e.preventDefault(); e.stopPropagation(); return; }
  var fn=A[el.dataset.a]; if(!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset.id,el.dataset.v,el.dataset.p,el,e);
});
function bindOverlays(){
  $('sheet-ov').addEventListener('click',function(e){ if(e.target.id==='sheet-ov') closeSheet(); });
  $('cap-ov').addEventListener('click',function(e){ if(e.target.id==='cap-ov') closeCap(); });
  var ta=$('cap-text');
  ta.addEventListener('input',capInput);
  ta.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); saveCapture(); } });
  ta.addEventListener('paste',function(){ setTimeout(capInput,0); });
  $('search-input').addEventListener('input',function(){ searchQ=this.value.trim(); expandedId=null; render(); });
  $('search-input').addEventListener('keydown',function(e){ if(e.key==='Escape') closeSearch(); });
}

/* ── KEYBOARD (desktop) ── */
document.addEventListener('keydown',function(e){
  var lock=$('lock-screen'); if(lock&&lock.style.display!=='none') return;
  var tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'){
    if($('sheet-ov').classList.contains('open')) closeSheet();
    else if($('cap-ov').classList.contains('open')) closeCap();
    else if($('focus-ov').classList.contains('on')) exitFocus();
    else if(searchQ||$('search-bar').classList.contains('on')) closeSearch();
    else if(expandedId){ expandedId=null; render(); }
    return;
  }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if($('cap-ov').classList.contains('open')||$('sheet-ov').classList.contains('open')) return;
  if(e.key==='n'||e.key==='c'){ e.preventDefault(); openCapture(); }
  else if(e.key==='/'){ e.preventDefault(); openSearch(); }
  else if(e.key==='f'&&!$('focus-ov').classList.contains('on')){ startFocus(); }
  else if(['1','2','3','4'].indexOf(e.key)>=0){ go(['today','inbox','people','later'][+e.key-1]); }
});

/* ══════════════════════════════════════════
   SWIPE: right = done · left = reveal Tomorrow / Waiting / Later
   Long-press = toggle Focus. Tap = expand inline actions (fallback for everything).
══════════════════════════════════════════ */
var _trayCard=null;
function resetCard(card){ if(!card) return; var i=card.querySelector('.c-inner'); if(i) i.style.transform=''; card.classList.remove('sw-r','sw-l','tray-open','dragging'); }
(function(){
  var c=document.getElementById('content'), S=null, TRAY=198;
  c.addEventListener('touchstart',function(e){
    if(e.touches.length>1) return;
    var inner=e.target.closest('.c-inner.sw');
    if(_trayCard&&(!inner||inner.parentNode!==_trayCard)){ resetCard(_trayCard); _trayCard=null; if(!e.target.closest('.sw-tray')){ _suppressClick=true; setTimeout(function(){ _suppressClick=false; },400); } }
    if(!inner||e.target.closest('.tick')) { S=null; return; }
    var card=inner.parentNode;
    S={inner:inner,card:card,x0:e.touches[0].clientX,y0:e.touches[0].clientY,dx:0,base:card.classList.contains('tray-open')?-TRAY:0,lock:null,moved:false,lp:false};
    S.lpt=setTimeout(function(){ if(S&&!S.moved){ S.lp=true; _suppressClick=true; setTimeout(function(){ _suppressClick=false; },700); if(navigator.vibrate) navigator.vibrate(25); toggleFocus(card.dataset.id); } },550);
  },{passive:true});
  c.addEventListener('touchmove',function(e){
    if(!S) return;
    var x=e.touches[0].clientX-S.x0, y=e.touches[0].clientY-S.y0;
    if(!S.moved&&(Math.abs(x)>8||Math.abs(y)>8)){ S.moved=true; clearTimeout(S.lpt); }
    if(S.lock===null&&S.moved){ S.lock=Math.abs(x)>Math.abs(y)*1.3?'x':'y'; if(S.lock==='x') S.card.classList.add('dragging'); }
    if(S.lock!=='x') return;
    e.preventDefault();
    var dx=Math.max(-TRAY-40,Math.min(S.base+x,170)); S.dx=dx;
    S.inner.style.transform='translateX('+dx+'px)';
    S.card.classList.toggle('sw-r',dx>0); S.card.classList.toggle('sw-l',dx<0);
  },{passive:false});
  function end(){
    if(!S) return; clearTimeout(S.lpt); var s=S; S=null;
    if(s.lp||s.lock!=='x') return;
    _suppressClick=true; setTimeout(function(){ _suppressClick=false; },350);
    s.card.classList.remove('dragging');
    if(s.dx>90){ s.inner.style.transform='translateX(110%)'; var id=s.card.dataset.id; setTimeout(function(){ doDone(id); },170); }
    else if(s.dx<-70){ s.inner.style.transform='translateX(-'+TRAY+'px)'; s.card.classList.add('tray-open'); s.card.classList.remove('sw-r'); _trayCard=s.card; }
    else resetCard(s.card);
  }
  c.addEventListener('touchend',end); c.addEventListener('touchcancel',end);
})();

/* ══════════════════════════════════════════
   LOCK (unchanged from v4) + INIT
══════════════════════════════════════════ */
var LOCK_HASH_KEY='maxa_lock_hash', LOCK_TRUSTED_KEY='maxa_lock_trusted', APP_PASSWORD='Maxa2026';
async function hashPassword(p){ var buf=new TextEncoder().encode(p); var h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(''); }
async function initLock(){
  var lock=$('lock-screen'); if(!lock){ initApp(); return; }
  var stored=lsGet(LOCK_HASH_KEY); if(!stored){ stored=await hashPassword(APP_PASSWORD); lsSet(LOCK_HASH_KEY,stored); }
  if(lsGet(LOCK_TRUSTED_KEY)===stored){ lock.style.display='none'; initApp(); return; }
  lock.style.display='flex'; setTimeout(function(){ var i=$('lock-input'); if(i) i.focus(); },100);
}
async function checkLock(){
  var inp=$('lock-input'), err=$('lock-error'); if(!inp) return;
  if(!inp.value){ if(err) err.textContent='Please enter the password'; return; }
  var stored=lsGet(LOCK_HASH_KEY), h=await hashPassword(inp.value);
  if(h===stored){ lsSet(LOCK_TRUSTED_KEY,stored); var lock=$('lock-screen'); lock.style.transition='opacity .3s'; lock.style.opacity='0'; setTimeout(function(){ lock.style.display='none'; lock.style.opacity='1'; },300); initApp(); }
  else { if(err) err.textContent='Incorrect password'; inp.value=''; inp.focus(); }
}
var _inited=false;
function initApp(){
  if(_inited) return; _inited=true;
  applyTheme(); bindOverlays(); load(); dailyBackup(); render(); setSyncDot('ok');
  setTimeout(bgPull,800);
  setInterval(bgPull,2*60*1000);
  setInterval(function(){ if(!document.hidden&&!document.querySelector('.ov.open')&&!_trayCard) render(); },5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'){ if(!document.querySelector('.ov.open')) render(); bgPull(); } });
  if(window.matchMedia) try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}
  if(Object.keys(_dirty).length) schedulePush();
}
initLock();
(function keepAlive(){
  var K='maxa_keepalive', last=+lsGet(K)||0, now=Date.now();
  if(now-last>864e5) fetch(SUPA_URL+'/rest/v1/tasks?select=id&limit=1',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}}).then(function(){ lsSet(K,String(now)); }).catch(function(){});
})();

</script>

<script>
// PWA install prompt for Android Chrome / Edge
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  var btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', function() {
  deferredPrompt = null;
  var btn = document.getElementById('install-btn');
  if(btn) btn.style.display = 'none';
});
function installApp() {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(r) {
    deferredPrompt = null;
    var btn = document.getElementById('install-btn');
    if(btn) btn.style.display = 'none';
  });
}
// Register service worker for offline use (Android/Windows)
if('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    // Inline service worker via blob
    var swCode = 'const CACHE="maxa-v1";self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE)));self.addEventListener("fetch",e=>e.respondWith(caches.open(CACHE).then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(nr=>{c.put(e.request,nr.clone());return nr;}).catch(()=>r)))));';
    var blob = new Blob([swCode], {type:'application/javascript'});
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(function(){});
  });
}
</script>
